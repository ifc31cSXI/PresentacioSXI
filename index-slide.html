<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serveis de configuració automàtica de xarxa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/serif.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/plugin/highlight/github.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* cspell:disable */
    :root {
      --deck-green: #32cd33;
      --deck-green-dark: #175f16;
      --deck-text: #555;
      --deck-soft-green: #eff8ef;
    }

    .reveal {
      --r-background-color: #fff;
      --r-main-font: "Poppins", Arial, sans-serif;
      --r-main-color: var(--deck-text);
      --r-heading-font: "Poppins", Arial, sans-serif;
      --r-heading-color: var(--deck-green-dark);
      --r-link-color: var(--deck-green-dark);
      --r-link-color-hover: var(--deck-green);
      font-family: "Poppins", Arial, sans-serif;
    }

    .reveal .slides section {
      text-align: left;
      box-sizing: border-box;
      padding: 100px 70px 18px;
    }

    .reveal .slides section .mermaid {
      width: 100%;
      text-align: center;
      border-left: 4px solid var(--deck-green);
    }
    
    .reveal .slides section .mermaid svg {
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
    }
    
    .reveal h1,
    .reveal h2,
    .reveal h3,
    .reveal h4,
    .reveal h5,
    .reveal h6 {
      font-weight: 500;
      font-family: "Poppins", Arial, sans-serif
    }


    .reveal h4,
    .reveal h5,
    .reveal h6 {
      font-family: "Poppins", Arial, sans-serif;
      /* margin-top: 1em; */
      margin-bottom: 0.4em;
    }

        /* .reveal h4 {
      color: var(--deck-green-dark);
      font-family: "Poppins", Arial, sans-serif;
      font-size: 1.15em;
      font-weight: 700;
      margin-top: 1em;
      margin-bottom: 0.4em;
    } */

    .reveal h1 {
      color: var(--deck-green-dark);
      font-size: 2.6em;
    }

    .reveal h2 {
      padding-left: 0.45em;
      border-left: 0.12em solid var(--deck-green);
      color: var(--deck-green-dark);
    }

    .reveal h3,
    .reveal h4 {
      color: var(--deck-green-dark);
    }

    .reveal .slides > section:first-child h1:first-child {
      color: var(--deck-green-dark);
    }

    .reveal p,
    .reveal li {
      line-height: 1.2;
      font-size: 0.80em;
    }

    .reveal .slides section img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 50vh;
      object-fit: contain;
      margin: 0.35em 0 0 2em;
      
    }

.reveal a {
  color: var(--deck-green-dark);
  text-decoration: underline;
  text-decoration-color: var(--deck-green);
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
}

.reveal a:hover {
  color: var(--deck-green);
  background: var(--deck-soft-green);
}

    .reveal ul,
    .reveal ol {
      display: block;
      margin-left: 0.7em;
    }

    .reveal li::marker {
      color: var(--deck-green);
    }

    .reveal strong {
      color: var(--deck-green-dark);
      font-weight: 600;
    }

    .reveal code {
      color: var(--deck-green-dark);
      background: var(--deck-soft-green);
      border-radius: 0.2em;
      padding: 0.08em 0.25em;
    }

    .reveal pre code {
      border-left: 4px solid var(--deck-green);
    }

    .reveal table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.58em;
    }

    .reveal th {
      background: var(--deck-green-dark);
      color: #fff;
    }

    .reveal th,
    .reveal td {
      padding: 0.4em 0.55em;
      border: 1px solid #d8e5d8;
    }

    .reveal tr:nth-child(even) td {
      background: var(--deck-soft-green);
    }

    .reveal .progress {
      color: var(--deck-green);
    }

    .deck-header {
      position: fixed;
      z-index: 30;
      top: 16px;
      left: 20px;
      width: 170px;
      pointer-events: none;
    }

    .deck-header img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* cspell:enable */
  </style>
</head>
<body>

  <header class="deck-header">
    <img src="img/IconaSXI.svg" alt="Serveis de Xarxa i Internet">
  </header>

  <div class="reveal">
    <div class="slides">
      <!-- Carregador extern del fitxer Markdown -->
      <section id="presentation-markdown"
         data-separator="^\r?\n---\r?\n$"
         data-separator-vertical="^\r?\n---v\r?\n$"
         data-notes="^Note:">
      </section>
    </div>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/plugin/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/plugin/highlight/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/plugin/notes/notes.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"></script>
  <script>
    const markdownFiles = [
      "Unitat03/serveis_configuracio_automatica_xarxa.md",
      "Unitat03/file.md"
    ];
  
    const requestedFile = new URLSearchParams(window.location.search).get("md");
    const selectedFile = markdownFiles.includes(requestedFile)
      ? requestedFile
      : "Unitat03/serveis_configuracio_automatica_xarxa.md";
  
    document
      .querySelector("#presentation-markdown")
      .setAttribute("data-markdown", selectedFile);
    // index-slide.html?md=GuiaGitGithub.md
    // index-slide.html?md=GuiaCollaboracioGit.md
    // index-slide.html?md=GuiaVisualStudioCodeAmbGitiGitHub.md
  </script>
  <script>
    mermaid.initialize({ startOnLoad: false });

    async function renderMermaidInSlide(slide) {
      await new Promise(requestAnimationFrame);
      const nodes = [...slide.querySelectorAll('pre > code.mermaid')].map(code => {
        const diagram = code.parentElement;
        diagram.classList.add('mermaid');
        diagram.textContent = code.textContent;
        return diagram;
      });
      if (nodes.length > 0) {
        await mermaid.run({ nodes });
      }
    }

    Reveal.on('ready', event => renderMermaidInSlide(event.currentSlide));
    Reveal.on('slidechanged', event => renderMermaidInSlide(event.currentSlide));
  </script>
  <script>
    /* cspell:disable */
    Reveal.initialize({
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ],
      /* Ajusta la mida de la presentació a la pantalla */
      width: 1600,
      height: 900,
      margin: 0.02,
      center: false,
      hash: true,
      progress: true
    });
    /* cspell:enable */
  </script>
</body>
</html>
